<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>投票結果ダッシュボード</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="font-family: sans-serif; margin: 40px;">
    <h1>投票結果</h1>
    <canvas id="voteChart" width="400" height="200"></canvas>

    <script>
        const ctx = document.getElementById('voteChart').getContext('2d');
        let voteChart; // Chart.js インスタンス

        // グラフ描画関数
        function drawChart(votesData) {
            const labels = votesData.map(v => v.option);
            const counts = votesData.map(v => v.count);

            if (voteChart) {
                // 既存グラフを更新
                voteChart.data.labels = labels;
                voteChart.data.datasets[0].data = counts;
                voteChart.update();
            } else {
                // 初回描画
                voteChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '投票数',
                            data: counts,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
        }

        // APIからデータ取得
        async function fetchVotes() {
            const response = await fetch('/votes');
            const data = await response.json();
            drawChart(data);
        }

        // 初回取得
        fetchVotes();

        // 5秒ごとに自動更新
        setInterval(fetchVotes, 5000);
    </script>
</body>
</html>
